<title id="title">SET-0001 · 决策结构示意</title><desc id="desc">原创七轴示意，非真实市场数据；开盘越界未获跟随；前一session区间边缘；越界→回收→强反向柱；信号柱端点触发；反转极值重破；回到旧区间或新反向趋势；OHLC</desc>
<rect width="980" height="920" fill="#f5f3ec"/>
