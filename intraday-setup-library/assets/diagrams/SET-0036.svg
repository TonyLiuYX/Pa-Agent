<title id="title">SET-0036 · 决策结构示意</title><desc id="desc">原创七轴示意，非真实市场数据；强冲后的更高微观接受；上部厚成交分布下沿/LVN；高处积量、下沿保持/吸收；尽量靠分布下沿保持后买入；上部分布边缘被持续穿回；上方拍卖参考/接受跟踪、当天结束；实时Footprint成交分布</desc>
<rect width="980" height="920" fill="#f5f3ec"/>
