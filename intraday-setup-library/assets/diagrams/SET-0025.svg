<svg xmlns="http://www.w3.org/2000/svg" width="980" height="920" viewBox="0 0 980 920" role="img" aria-labelledby="title desc">
<title id="title">SET-0025 · 决策结构示意</title><desc id="desc">原创七轴示意，非真实市场数据；已辨认双向平衡且VWAP较平；均价外异常偏离区域；伸展后无法持续、新极值失败；动量衰退后局部结构反穿（编辑版）；失败极值外/新趋势接受；VWAP目标、先验空间检查、当日结束；因果VWAP+OHLC+波动尺度</desc>
<rect width="980" height="920" fill="#f5f3ec"/>
