<text x="36" y="52" fill="#193c36" font-size="26" font-weight="650">SET-0025 · 决策结构示意</text>
<text x="36" y="88" fill="#73553b" font-size="18">原创结构图 · 非真实市场数据 · 不显示价格、成交或收益</text>
